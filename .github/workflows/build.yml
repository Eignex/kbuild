name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# A newer push supersedes any in-flight run for the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      # Persists the Gradle home incl. the build and configuration caches across runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('build.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Verify combined Central deployment locally
        run: |
          ./gradlew mavenCentralBundle
          # Avoid serializing upload credentials while inspecting the plan without secrets.
          ./gradlew publishToMavenCentral --dry-run --no-configuration-cache --console=plain > build/central-publish-plan.txt
          python3 .github/scripts/check-publication-files.py build/maven-central-publishing/bundle.zip --publish-plan build/central-publish-plan.txt

      - name: Set up Android consumer tools
        run: |
          android_cli="$RUNNER_TEMP/android"
          android_sdk="$RUNNER_TEMP/android-sdk"
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/android -o "$android_cli"
          chmod +x "$android_cli"
          "$android_cli" --no-metrics --sdk="$android_sdk" sdk install build-tools/37.0.0 platforms/android-36
          echo "ANDROID_HOME=$android_sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_sdk" >> "$GITHUB_ENV"

      - name: Sample smoke test
        run: ./samples/smoke-test.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
            platform/build/reports/tests/
            platform/build/test-results/
          if-no-files-found: ignore

  build-macos:
    name: Build (macOS CLI sample)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Persists the Gradle home incl. the build and configuration caches across runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('build.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: CLI sample check and release assets
        run: |
          cd samples
          # Kotlin/Native defaults to four cache threads, exceeding this runner's CPU count.
          native_threads=$(sysctl -n hw.logicalcpu)
          ../gradlew --no-daemon -Pkotlin.native.parallelThreads="$((native_threads < 4 ? native_threads : 4))" :cli-positive:check :cli-positive:releaseAssets

      - name: Verify release assets
        run: |
          cd samples/cli-positive/build/release-assets
          shasum -a 256 -c SHA256SUMS
          ./cli-positive-SNAPSHOT-macos-arm64 | grep "hello kbuild"
