name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('build.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Sample smoke test
        run: ./samples/smoke-test.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
            platform/build/reports/tests/
            platform/build/test-results/
          if-no-files-found: ignore

  build-macos:
    name: Build (macOS CLI sample)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('build.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: CLI sample check and release assets
        run: |
          cd samples
          ../gradlew --no-daemon :cli-positive:check :cli-positive:releaseAssets

      - name: Verify release assets
        run: |
          cd samples/cli-positive/build/release-assets
          shasum -a 256 -c SHA256SUMS
          ./cli-positive-SNAPSHOT-macos-arm64 | grep "hello kbuild"
