name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

# A newer push supersedes any in-flight run for the same ref.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      # Build jobs persist dependency and encrypted configuration caches.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/gradle-wrapper.properties', '**/*.versions.toml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-konan-

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Verify GitHub Release assets and anonymous consumers
        env:
          RELEASE_VERSION: 0.0.0-ci.${{ github.run_id }}
        run: |
          ./gradlew releaseAssets -PciVersion="$RELEASE_VERSION"
          # A second run also verifies staging works with the configuration cache.
          ./gradlew releaseAssets -PciVersion="$RELEASE_VERSION"
          bash .github/scripts/check-publication-files.sh build/release-assets --version "$RELEASE_VERSION"
          bash .github/scripts/check-release-resolution.sh --version "$RELEASE_VERSION"

      - name: Set up Android consumer tools
        run: |
          android_cli="$RUNNER_TEMP/android"
          android_sdk="$RUNNER_TEMP/android-sdk"
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/android -o "$android_cli"
          chmod +x "$android_cli"
          "$android_cli" --no-metrics --sdk="$android_sdk" sdk install build-tools/37.0.0 platforms/android-36
          echo "ANDROID_HOME=$android_sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_sdk" >> "$GITHUB_ENV"

      - name: Sample smoke test
        run: ./samples/smoke-test.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
            platform/build/reports/tests/
            platform/build/test-results/
          if-no-files-found: ignore

  build-macos:
    name: Build (macOS CLI sample)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25

      # Build jobs persist dependency and encrypted configuration caches.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/gradle-wrapper.properties', '**/*.versions.toml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-konan-

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: CLI sample check and release assets
        run: |
          cd samples
          # Kotlin/Native defaults to four cache threads, exceeding this runner's CPU count.
          native_threads=$(sysctl -n hw.logicalcpu)
          ../gradlew --no-daemon -Pkotlin.native.parallelThreads="$((native_threads < 4 ? native_threads : 4))" :cli-positive:check :cli-positive:releaseAssets

      - name: Verify release assets
        run: |
          cd samples/cli-positive/build/release-assets
          shasum -a 256 -c SHA256SUMS
          ./cli-positive-SNAPSHOT-macos-arm64 | grep "hello kbuild"
