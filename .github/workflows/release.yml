name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dryRun:
        description: Build and validate assets without publishing (publishing requires a tag)
        type: boolean
        default: true

permissions:
  contents: read

# Never cancel a tag release while its assets are being uploaded or verified.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Resolve version
        env:
          DRY_RUN: ${{ inputs.dryRun == true }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "$DRY_RUN" == "true" ]]; then
            version="0.0.0-dry-run.$GITHUB_RUN_ID"
          else
            echo "Publishing requires a version tag; use dryRun on a branch." >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ || "$version" == *SNAPSHOT* ]]; then
            echo "Expected a pinned release version, got: $version" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "DRY_RUN=$DRY_RUN" >> "$GITHUB_ENV"

      - name: Build, test, and stage release assets
        run: ./gradlew build releaseAssets -PciVersion="$RELEASE_VERSION"

      - name: Validate release layout and anonymous consumers before publishing
        run: |
          python3 .github/scripts/check-publication-files.py build/release-assets --version "$RELEASE_VERSION"
          python3 .github/scripts/check-release-resolution.py --version "$RELEASE_VERSION" --gradle "$(command -v gradle)"

      - name: Upload validated assets for inspection
        uses: actions/upload-artifact@v7
        with:
          name: kbuild-release-assets
          path: build/release-assets/
          if-no-files-found: error

      - name: Create public GitHub Release with assets
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--verify-tag --generate-notes)
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" build/release-assets/* "${args[@]}"

      - name: Verify anonymous resolution from the public release
        if: env.DRY_RUN != 'true'
        # The check forwards only PATH/JDK paths/locale and uses isolated HOME/Gradle homes.
        # Neither the GitHub token nor Gradle's cached credentials reach these builds.
        run: |
          python3 .github/scripts/check-release-resolution.py --version "$RELEASE_VERSION" \
            --repository-url "https://github.com/$GITHUB_REPOSITORY/releases/download" --gradle "$(command -v gradle)"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
