name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dryRun:
        description: Build and validate assets without publishing (publishing requires a tag)
        type: boolean
        default: true

permissions:
  contents: read

# Never cancel a tag release while its assets are being uploaded or verified.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release version and revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.version.outputs.dry_run }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Resolve release version
        id: version
        env:
          DRY_RUN: ${{ inputs.dryRun == true }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "$DRY_RUN" == true ]]; then
            version="0.0.0-dry-run.$GITHUB_RUN_ID"
          else
            echo "Publishing requires a version tag; use dryRun on a branch." >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ || "$version" == *SNAPSHOT* ]]; then
            echo "Expected a pinned release version, got: $version" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "dry_run=$DRY_RUN"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  # Tags and manual runs use the same Linux, Android, and macOS gate as pull requests.
  validate:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.revision }}
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  publish:
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Restore Kotlin/Native toolchain
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/gradle-wrapper.properties', '**/*.versions.toml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-konan-

      - name: Build, test, and stage release assets
        run: ./gradlew build releaseAssets -PciVersion="$RELEASE_VERSION"

      - name: Validate release layout and anonymous consumers before publishing
        run: |
          bash .github/scripts/check-publication-files.sh build/release-assets --version "$RELEASE_VERSION"
          bash .github/scripts/check-release-resolution.sh --version "$RELEASE_VERSION"

      - name: Upload validated assets for inspection
        uses: actions/upload-artifact@v7
        with:
          name: kbuild-release-assets
          path: build/release-assets/
          if-no-files-found: error

      - name: Create public GitHub Release with assets
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./gradlew :publishToGitHubRelease -PciVersion="$RELEASE_VERSION"

      - name: Verify anonymous resolution from the public release
        if: env.DRY_RUN != 'true'
        # Only PATH/JDK paths/locale reach the isolated HOME/Gradle homes.
        run: |
          bash .github/scripts/check-release-resolution.sh --version "$RELEASE_VERSION" \
            --repository-url "https://github.com/$GITHUB_REPOSITORY/releases/download"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
